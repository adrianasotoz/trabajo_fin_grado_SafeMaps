<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Rutas Seguras Madrid</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { height: 100%; }
    #panel {
        position: absolute; top: 12px; right: 12px; z-index: 1000;
        background: white; padding: 14px 16px; border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.25); width: 260px; font-size: 14px;
    }
    #panel h1 { font-size: 16px; margin: 0 0 8px; }
    #panel p.ayuda { color: #555; margin: 0 0 10px; }
    .ruta { margin-bottom: 8px; padding: 6px 8px; border-radius: 4px; }
    .ruta.rapida { background: #e8f0fe; border-left: 4px solid #1a73e8; }
    .ruta.segura { background: #e6f4ea; border-left: 4px solid #188038; }
    .ruta strong { display: block; }
    #limpiar { margin-top: 6px; width: 100%; padding: 6px; cursor: pointer; }
    #error { color: #c5221f; margin-top: 8px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
    <h1>Rutas Seguras Madrid</h1>
    <p class="ayuda">Haz clic en el mapa para el origen y luego para el destino.</p>
    <div id="resultados"></div>
    <button id="limpiar">Limpiar</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([40.4168, -3.7038], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
}).addTo(map);

const ESTILOS = {
    rapida: { color: '#1a73e8', weight: 5, opacity: 0.8, dashArray: '8 6' },
    segura: { color: '#188038', weight: 5, opacity: 0.8 },
};

let origen = null;
let destino = null;
let marcadorOrigen = null;
let marcadorDestino = null;
let capasRutas = [];

function limpiar() {
    origen = null;
    destino = null;
    if (marcadorOrigen) map.removeLayer(marcadorOrigen);
    if (marcadorDestino) map.removeLayer(marcadorDestino);
    capasRutas.forEach(capa => map.removeLayer(capa));
    capasRutas = [];
    marcadorOrigen = null;
    marcadorDestino = null;
    document.getElementById('resultados').innerHTML = '';
}

document.getElementById('limpiar').addEventListener('click', limpiar);

map.on('click', (e) => {
    const { lat, lng } = e.latlng;
    if (!origen) {
        limpiar();
        origen = [lng, lat];
        marcadorOrigen = L.marker([lat, lng], { title: 'Origen' }).addTo(map);
    } else if (!destino) {
        destino = [lng, lat];
        marcadorDestino = L.marker([lat, lng], { title: 'Destino' }).addTo(map);
        calcularRutas();
    }
});

async function calcularRutas() {
    document.getElementById('resultados').innerHTML = '<p>Calculando rutas...</p>';
    const params = new URLSearchParams({
        origen_lon: origen[0], origen_lat: origen[1],
        destino_lon: destino[0], destino_lat: destino[1],
    });
    let datos;
    try {
        const resp = await fetch(`/api/ruta?${params}`);
        datos = await resp.json();
        if (!resp.ok) throw new Error(datos.error || 'Error al calcular la ruta');
    } catch (err) {
        document.getElementById('resultados').innerHTML = `<div id="error">${err.message}</div>`;
        return;
    }

    const nombres = { rapida: 'Ruta rápida', segura: 'Ruta segura' };
    let html = '';
    for (const criterio of ['segura', 'rapida']) {
        const ruta = datos[criterio];
        const capa = L.geoJSON(ruta.geometry, { style: ESTILOS[criterio] }).addTo(map);
        capasRutas.push(capa);
        html += `
            <div class="ruta ${criterio}">
                <strong>${nombres[criterio]}</strong>
                ${(ruta.distancia_m / 1000).toFixed(2)} km ·
                peligrosidad media ${ruta.peligrosidad_media.toFixed(3)}
            </div>`;
    }
    document.getElementById('resultados').innerHTML = html;

    const grupo = new L.featureGroup(capasRutas);
    map.fitBounds(grupo.getBounds(), { padding: [30, 30] });
}
</script>
</body>
</html>
